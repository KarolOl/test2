<form class="d-grid gap-3" (submit)="submit($event)" [attr.aria-busy]="submitting()">
  <div class="row g-3">
    <app-file-dropzone
      class="col-12 col-md-6"
      inputId="firstFile"
      label="Pierwszy plik"
      [file]="firstFile()"
      [disabled]="submitting()"
      [allowedExtensions]="settings.fileExtensions.firstFile"
      (fileSelected)="setFile('firstFile', $event)"
    />
    <app-file-dropzone
      class="col-12 col-md-6"
      inputId="secondFile"
      label="Drugi plik (opcjonalny)"
      [file]="secondFile()"
      [disabled]="submitting()"
      [allowedExtensions]="settings.fileExtensions.secondFile"
      (fileSelected)="setFile('secondFile', $event)"
    />
  </div>
  <div class="d-flex justify-content-end gap-2 flex-wrap">
    <button
      class="btn btn-primary px-4"
      type="button"
      [disabled]="submitting() || (!firstFile() && !secondFile())"
      (click)="requestClearFiles(clearDialog)"
    >
      Wyczyść pliki
    </button>
    <button
      class="btn btn-danger px-4"
      type="submit"
      [disabled]="!authenticated() || submitting()"
    >
      {{ submitting() ? 'Wysyłanie...' : authenticated() ? 'Wyślij' : 'Logowanie...' }}
    </button>
  </div>
</form>

<dialog
  #clearDialog
  class="clear-dialog border-0 rounded-3 p-0 shadow"
  aria-labelledby="clear-files-title"
  aria-describedby="clear-files-description"
  (click)="$event.target === clearDialog && clearDialog.close()"
>
  <div class="bg-white text-body">
    <div class="d-flex align-items-center justify-content-between gap-3 p-3 border-bottom">
      <h2 id="clear-files-title" class="h5 mb-0">Wyczyścić pliki?</h2>
      <button
        class="btn-close"
        type="button"
        aria-label="Zamknij"
        (click)="clearDialog.close()"
      ></button>
    </div>
    <div class="p-3">
      <p id="clear-files-description" class="mb-0">
        Oba pola plików oraz odpowiedź zostaną wyczyszczone. Czy chcesz kontynuować?
      </p>
    </div>
    <div class="d-flex justify-content-end gap-2 flex-wrap p-3 border-top">
      <button
        class="btn btn-outline-secondary"
        type="button"
        autofocus
        (click)="clearDialog.close()"
      >
        Anuluj
      </button>
      <button
        class="btn btn-danger"
        type="button"
        [disabled]="submitting()"
        (click)="clearFiles(clearDialog)"
      >
        Wyczyść
      </button>
    </div>
  </div>
</dialog>
