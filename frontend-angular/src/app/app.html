<app-loading-spinner
  [active]="isInitializing() || loading.isLoading()"
  [message]="isInitializing() ? 'Wczytywanie danych użytkownika...' : 'Ładowanie danych...'"
/>
@if (authentication.isAuthenticated()) {
  <main class="container min-vh-100 d-flex align-items-center py-3">
    <div class="row justify-content-center w-100 g-0">
      <section
        class="col-12 col-lg-10 col-xl-9 col-xxl-8 card shadow p-4 p-md-5"
        [attr.aria-busy]="loading.isLoading()"
      >
        <header
          class="d-flex align-items-center justify-content-between gap-3 border-bottom pb-3 mb-4"
        >
          <div
            class="border rounded bg-body-tertiary px-3 py-2 text-body-secondary small text-center flex-shrink-0"
            role="img"
            aria-label="Miejsce na logo"
          >
            <span class="d-block fw-bold text-uppercase">Logo</span>
            <span class="d-none d-sm-block">Miejsce na logo</span>
          </div>
          <app-user-menu class="ms-auto" [displayName]="userName()" (logoutRequested)="logout()" />
        </header>
        <div class="mb-4">
          <h1 class="h3 fw-semibold text-body mb-0 text-break">{{ settings.appTitle }}</h1>
        </div>
        @if (errorMessage()) {
          <p class="alert alert-danger mb-4" role="alert">{{ errorMessage() }}</p>
        }
        <app-file-upload-form
          [authenticated]="authentication.isAuthenticated()"
          [submitting]="isSubmitting()"
          (filesSubmitted)="submit($event)"
          (filesCleared)="clearResponse()"
          (selectionChanged)="errorMessage.set('')"
          (validationFailed)="errorMessage.set($event)"
        />
        @if (result(); as response) {
          <app-processing-result [response]="response" />
        }
        <footer class="border-top mt-4 pt-3 small text-body-secondary">
          Licencja <a class="link-secondary" href="LICENSE" rel="license">Apache 2.0</a>
        </footer>
      </section>
    </div>
  </main>
} @else if (errorMessage()) {
  <div class="container pt-3 pb-4">
    <p class="alert alert-danger mb-0" role="alert">{{ errorMessage() }}</p>
  </div>
}
